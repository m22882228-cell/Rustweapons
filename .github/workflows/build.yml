name: build
on:
  push:
    branches-ignore: [build-log]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: publish release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest build/libs/rustweapons-1.0.0.jar --title "Rust Weapons (latest build)" --notes "Minecraft 1.21.11, Fabric. Needs Fabric API." --target "${{ github.sha }}"
      - name: publish build log
        if: always()
        shell: bash
        run: |
          cp build.log /tmp/build.log || echo "no log" > /tmp/build.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/build.log build.log
          git add build.log
          git commit -m "build log"
          git push -f origin build-log
